[platformio]
default_envs = mp24_sample
core_dir = .work/pio
src_dir = firmware/src
include_dir = firmware/include

[env:mp24_sample]
build_src_filter = +<*> -<startup_probe.cpp>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 3014656
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions-mp24.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299
    h2zero/NimBLE-Arduino@2.3.6
lib_extra_dirs = third_party
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Ithird_party/dragon
    -Ithird_party/opendroneid/src
    -DUSER_SETUP_LOADED
    -DST7735_DRIVER
    -DST7735_REDTAB
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=5
    -DTFT_SCLK=4
    -DTFT_MISO=-1
    -DTFT_CS=-1
    -DTFT_DC=6
    -DTFT_RST=7
    -DSPI_FREQUENCY=26000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DSMOOTH_FONT
    -DODID_DISABLE_PRINTF
    -Wl,-zmuldefs

[env:mp24_probe]
extends = env:mp24_sample
build_src_filter = -<*> +<startup_probe.cpp>
lib_deps =
lib_extra_dirs =
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=5
    -DMP24_STARTUP_PROBE
    -DBOARD_HAS_PSRAM
